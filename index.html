<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f3f4f6;
            color: #111827;
            margin: 0;
            padding: 0;
        }
        .page {
            max-width: 1120px;
            margin: 0 auto;
            padding: 24px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .grid {
            display: grid;
            gap: 20px;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 1px 3px rgba(15,23,42,.08);
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }
        input,
        select,
        button {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            font-size: 0.95rem;
        }
        button {
            background: #4f46e5;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #4338ca;
        }
        .secondary {
            background: #e5e7eb;
            color: #111827;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }
        .stat {
            padding: 18px;
            border-radius: 16px;
            background: linear-gradient(135deg, #eef2ff, #ffffff);
        }
        .stat h2 {
            margin: 0 0 8px;
            font-size: 1rem;
            color: #6b7280;
        }
        .stat p {
            margin: 0;
            font-size: 1.45rem;
            font-weight: 700;
        }
        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 14px 12px;
            background: #ffffff;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            margin-bottom: 12px;
        }
        .expense-info {
            flex: 1;
        }
        .expense-description {
            font-weight: 700;
            margin-bottom: 4px;
        }
        .expense-meta {
            color: #6b7280;
            font-size: 0.9rem;
        }
        .expense-amount {
            min-width: 100px;
            text-align: right;
            font-weight: 700;
        }
        .expense-actions {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(2, minmax(80px, auto));
        }
        .btn-small {
            font-size: 0.85rem;
            padding: 8px 10px;
            border-radius: 10px;
        }
        .btn-edit {
            background: #22c55e;
        }
        .btn-delete {
            background: #ef4444;
        }
        .empty-state {
            color: #6b7280;
            font-size: 0.95rem;
            text-align: center;
            padding: 36px 0;
        }
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            width: min(520px, calc(100% - 32px));
            background: #ffffff;
            padding: 24px;
            border-radius: 20px;
            position: relative;
            box-shadow: 0 20px 80px rgba(15, 23, 42, 0.15);
        }
        .modal .close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: transparent;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #374151;
        }
        .charts {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }
        canvas {
            width: 100% !important;
            height: 320px !important;
            max-height: 360px;
        }
        .top-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="top-row">
            <div>
                <h1>Expense Tracker</h1>
                <p>Track spending, filter by category, and visualize your expenses.</p>
            </div>
            <button id="clearBtn" class="secondary">Clear All Expenses</button>
        </div>

        <section class="card">
            <form id="expenseForm">
                <div class="form-row">
                    <input id="description" type="text" placeholder="Description" required />
                    <input id="amount" type="number" step="0.01" placeholder="Amount" required />
                </div>
                <div class="form-row">
                    <select id="category" required>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Health">Health</option>
                        <option value="Education">Education</option>
                        <option value="Other">Other</option>
                    </select>
                    <input id="date" type="date" required />
                </div>
                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="cards">
            <div class="stat">
                <h2>Total Expenses</h2>
                <p id="totalExpenses">$0.00</p>
            </div>
            <div class="stat">
                <h2>This Month</h2>
                <p id="monthExpenses">$0.00</p>
            </div>
            <div class="stat">
                <h2>Last 7 Days</h2>
                <p id="weekExpenses">$0.00</p>
            </div>
            <div class="stat">
                <h2>Filter Category</h2>
                <select id="filterCategory">
                    <option value="">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Health">Health</option>
                    <option value="Education">Education</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </section>

        <section class="card">
            <div id="expensesList"></div>
        </section>

        <section class="charts">
            <div class="card">
                <h2>Category Breakdown</h2>
                <canvas id="categoryChart"></canvas>
            </div>
            <div class="card">
                <h2>Expense Trend</h2>
                <canvas id="trendChart"></canvas>
            </div>
        </section>
    </main>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <button class="close" type="button">×</button>
            <h2>Edit Expense</h2>
            <form id="editForm">
                <div class="form-row">
                    <input id="editDescription" type="text" placeholder="Description" required />
                    <input id="editAmount" type="number" step="0.01" placeholder="Amount" required />
                </div>
                <div class="form-row">
                    <select id="editCategory" required>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Health">Health</option>
                        <option value="Education">Education</option>
                        <option value="Other">Other</option>
                    </select>
                    <input id="editDate" type="date" required />
                </div>
                <button type="submit">Save Changes</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
